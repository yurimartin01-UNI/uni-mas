services:
  mariadb:
    image: ${MARIADB_IMAGE}
    container_name: unimas-mariadb
    restart: unless-stopped
    environment:
      - MARIADB_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD}
      - MARIADB_DATABASE=${MARIADB_DATABASE}
      - MARIADB_USER=${MARIADB_USER}
      - MARIADB_PASSWORD=${MARIADB_PASSWORD}
      - MARIADB_CHARACTER_SET=utf8mb4
      - MARIADB_COLLATE=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MARIADB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - mariadb_data:/bitnami/mariadb

  moodle:
    image: ${MOODLE_IMAGE}
    container_name: unimas-moodle
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - "${MOODLE_HTTP_PORT}:8080"
      - "${MOODLE_HTTPS_PORT}:8443"
    environment:
      - BITNAMI_DEBUG=${BITNAMI_DEBUG}
      - MOODLE_DATABASE_HOST=mariadb
      - MOODLE_DATABASE_PORT_NUMBER=3306
      - MOODLE_DATABASE_NAME=${MARIADB_DATABASE}
      - MOODLE_DATABASE_USER=${MARIADB_USER}
      - MOODLE_DATABASE_PASSWORD=${MARIADB_PASSWORD}
      - MOODLE_USERNAME=${MOODLE_ADMIN_USER}
      - MOODLE_PASSWORD=${MOODLE_ADMIN_PASSWORD}
      - MOODLE_EMAIL=${MOODLE_ADMIN_EMAIL}
      - MOODLE_SITE_NAME=${MOODLE_SITE_NAME}
      - MOODLE_HOST=${MOODLE_HOST}
      - MOODLE_LANG=${MOODLE_LANG}
      - MOODLE_SMTP_HOST=mailpit
      - MOODLE_SMTP_PORT=1025
      - MOODLE_SMTP_USER=
      - MOODLE_SMTP_PASSWORD=
      - MOODLE_SMTP_PROTOCOL=none
      - MOODLE_CRON_MINUTES=1
    volumes:
      - moodle_app:/bitnami/moodle
      - moodle_data:/bitnami/moodledata

  plugin-sync:
    image: docker.io/alpine:3.20
    container_name: unimas-plugin-sync
    restart: unless-stopped
    depends_on:
      - moodle
    command:
      - /bin/sh
      - -ec
      - |
        apk add --no-cache rsync inotify-tools >/dev/null
        until [ -f /moodle/config.php ]; do
          echo "plugin-sync: esperando instalación inicial de Moodle..."
          sleep 3
        done
        mkdir -p /moodle/local/unimas
        rsync -a --delete /src/ /moodle/local/unimas/
        while inotifywait -r -e modify,create,delete,move /src; do
          rsync -a --delete /src/ /moodle/local/unimas/
          echo "plugin-sync: cambios sincronizados"
        done
    volumes:
      - moodle_app:/moodle
      - ./unimas:/src:ro

  mailpit:
    image: docker.io/axllent/mailpit:latest
    container_name: unimas-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_UI_PORT}:8025"
      - "${MAILPIT_SMTP_PORT}:1025"

  adminer:
    image: docker.io/adminer:latest
    container_name: unimas-adminer
    profiles: ["tools"]
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT}:8080"
    depends_on:
      - mariadb

volumes:
  moodle_app:
  mariadb_data:
  moodle_data:
